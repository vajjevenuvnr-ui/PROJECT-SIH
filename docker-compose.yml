# One-command local run for judging:  docker compose up --build   ->  http://localhost:3000
services:
  backend:
    build: ./backend
    environment:
      - DEMO_MODE=true
    env_file:
      - path: ./backend/.env
        required: false
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      - BACKEND_URL=http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
